<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On - GarderobeAI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tryon-container { display: flex; gap: 2rem; flex-wrap: wrap; }
        .tryon-column { flex: 1; min-width: 300px; }
        .selectable-item { cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .selectable-item.selected { border-color: var(--primary-color); transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>
    <nav>
        <a href="welcome.html" class="logo-container">
            <img src="assets/logo_clean.png" alt="GarderobeAI" class="logo-img">
            <span class="logo">GarderobeAI</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">My Wardrobe</a>
            <a href="upload.html">Upload</a>
            <a href="recommend.html">Get Outfit</a>
            <a href="tryon.html" style="color: #fff;">Try-On</a>
            <a href="mannequin.html">3D View</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container animate-in">
        <h1 style="text-align: center;">AI Virtual Try-On</h1>
        <p style="text-align: center; color: #94a3b8; margin-bottom: 2rem;">Upload a full-body photo of yourself and select an item to try on.</p>
        
        <div class="tryon-container">
            <div class="tryon-column glass-panel">
                <h3>1. Your Photo</h3>
                <input type="file" id="user-image" class="form-control" accept="image/*" style="margin: 1rem 0;">
                <img id="user-preview" src="" style="width: 100%; border-radius: 8px; display: none;">
            </div>
            
            <div class="tryon-column glass-panel">
                <h3>2. Select Clothing</h3>
                <div class="clothing-grid" id="clothes-grid" style="grid-template-columns: repeat(2, 1fr); max-height: 400px; overflow-y: auto; padding-right: 10px;">
                    <p>Loading wardrobe...</p>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn btn-primary" id="tryon-btn" disabled style="padding: 1rem 3rem; font-size: 1.2rem;">Generate Try-On</button>
        </div>
        
        <div id="status-msg" style="text-align: center; margin-top: 1rem; display: none;"></div>

        <div id="result-container" class="glass-panel" style="margin-top: 2rem; display: none; text-align: center;">
            <h3>Your Virtual Try-On Result ✨</h3>
            <img id="result-img" src="" style="max-width: 100%; max-height: 600px; border-radius: 8px; margin-top: 1rem;">
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let selectedClothingId = null;
        const userImgInput = document.getElementById('user-image');
        const tryonBtn = document.getElementById('tryon-btn');

        // Load clothes
        async function loadClothes() {
            try {
                const clothes = await apiCall('/clothes/');
                const grid = document.getElementById('clothes-grid');
                grid.innerHTML = '';
                
                if (clothes.length === 0) grid.innerHTML = '<p>No clothes found. Please upload some first.</p>';

                clothes.forEach(item => {
                    const img = document.createElement('img');
                    const imageUrl = item.image.startsWith('http') ? item.image : `http://127.0.0.1:8000${item.image}`;
                    img.src = imageUrl;
                    img.className = 'selectable-item';
                    img.style.width = '100%';
                    img.style.height = '150px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '8px';
                    
                    img.onclick = () => {
                        document.querySelectorAll('.selectable-item').forEach(el => el.classList.remove('selected'));
                        img.classList.add('selected');
                        selectedClothingId = item.id;
                        checkReady();
                    };
                    
                    grid.appendChild(img);
                });
            } catch (err) {
                console.error(err);
            }
        }

        userImgInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.getElementById('user-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(this.files[0]);
                checkReady();
            }
        });

        function checkReady() {
            if (userImgInput.files.length > 0 && selectedClothingId) {
                tryonBtn.disabled = false;
            } else {
                tryonBtn.disabled = true;
            }
        }

        tryonBtn.addEventListener('click', async () => {
            const status = document.getElementById('status-msg');
            const resultContainer = document.getElementById('result-container');
            const resultImg = document.getElementById('result-img');
            
            tryonBtn.disabled = true;
            tryonBtn.textContent = 'Processing (This might take a moment)...';
            status.style.display = 'block';
            status.style.color = '#94a3b8';
            status.textContent = 'Our AI is blending the clothing onto your photo...';
            resultContainer.style.display = 'none';

            const formData = new FormData();
            formData.append('user_image', userImgInput.files[0]);
            formData.append('clothing_id', selectedClothingId);

            try {
                const res = await apiCall('/try-on/', {
                    method: 'POST',
                    body: formData,
                    isFormData: true
                });
                
                status.style.display = 'none';
                const resultUrl = res.tryon_url.startsWith('http') ? res.tryon_url : `http://127.0.0.1:8000${res.tryon_url}`;
                resultImg.src = resultUrl;
                resultContainer.style.display = 'block';
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                status.style.color = 'var(--accent-color)';
                status.textContent = err.message;
            } finally {
                tryonBtn.disabled = false;
                tryonBtn.textContent = 'Generate Try-On';
            }
        });

        document.addEventListener('DOMContentLoaded', loadClothes);
    </script>
</body>
</html>
