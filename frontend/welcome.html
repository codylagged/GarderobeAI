<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - GarderobeAI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            text-align: center;
        }
        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            line-height: 1.1;
        }
        .hero-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            max-width: 700px;
            line-height: 1.6;
        }
        .feature-dots {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            color: #cbd5e1;
        }
        .dot-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>
    <nav>
        <a href="welcome.html" class="logo-container">
            <img src="assets/logo_clean.png" alt="GarderobeAI" class="logo-img">
            <span class="logo">GarderobeAI</span>
        </a>
    </nav>

    <div class="container center-content animate-in">
        <div class="welcome-container">
            <div class="mascot-container">
                <img src="assets/logo_clean.png" alt="Garderobe" class="mascot-img">
                <div class="magic-glow"></div>
            </div>
            <h1 class="hero-title">Your Wardrobe, <br>Evolved.</h1>
            <p class="hero-subtitle">Experience a new way of dressing. Let our AI analyze your style, recommend the perfect outfit for any occasion, and let you try it on without changing a single cloth.</p>
            
            <div class="feature-dots">
                <div class="dot-item"><div class="dot"></div> AI Analysis</div>
                <div class="dot-item"><div class="dot" style="background: var(--secondary-color)"></div> Smart Styling</div>
                <div class="dot-item"><div class="dot" style="background: var(--accent-color)"></div> Virtual Try-On</div>
            </div>

            <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;">
                <a href="dashboard.html" class="btn btn-primary" style="padding: 1rem 2.5rem; font-size: 1.1rem; min-width: 200px;">My Wardrobe</a>
                <a href="profile.html" class="btn btn-primary" style="padding: 1rem 2.5rem; font-size: 1.1rem; min-width: 200px;">My Profile</a>
                <a href="mannequin.html" class="btn btn-primary" style="padding: 1rem 2.5rem; font-size: 1.1rem; min-width: 200px;">Open 3D Model</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
