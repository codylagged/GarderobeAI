<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Outfit - GarderobeAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>
    <nav>
        <a href="welcome.html" class="logo-container">
            <img src="assets/logo_clean.png" alt="GarderobeAI" class="logo-img">
            <span class="logo">GarderobeAI</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">My Wardrobe</a>
            <a href="upload.html">Upload</a>
            <a href="recommend.html" style="color: #fff;">Get Outfit</a>
            <a href="mannequin.html">3D View</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container animate-in">
        <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
            <h1 style="text-align: center;">AI Outfit Stylist</h1>
            
            <form id="recommend-form" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem;">
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label>Occasion</label>
                    <select id="occasion" class="form-control">
                        <option value="Casual">Casual</option>
                        <option value="Formal">Formal</option>
                        <option value="Party">Party</option>
                        <option value="Work">Work</option>
                        <option value="Sport">Sport</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label>Skin Tone</label>
                    <select id="skin_tone" class="form-control">
                        <option value="Fair">Fair</option>
                        <option value="Medium">Medium</option>
                        <option value="Dark">Dark</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px; display: flex; align-items: flex-end; margin-bottom: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;" id="rec-btn">Generate Outfit</button>
                </div>
            </form>

            <div id="result-container" style="display: none;">
                <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Recommended For You</h3>
                <p id="rec-reason" style="color: var(--primary-color); margin-bottom: 1.5rem; font-style: italic;"></p>
                <div class="clothing-grid" id="rec-grid"></div>
            </div>
            <div id="error-msg" style="color: var(--accent-color); text-align: center; display: none;"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('recommend-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const occasion = document.getElementById('occasion').value;
            const skin_tone = document.getElementById('skin_tone').value;
            const btn = document.getElementById('rec-btn');
            const resultContainer = document.getElementById('result-container');
            const errorMsg = document.getElementById('error-msg');
            
            btn.disabled = true;
            btn.textContent = 'Styling...';
            errorMsg.style.display = 'none';
            resultContainer.style.display = 'none';

            try {
                const res = await apiCall('/recommend/', {
                    method: 'POST',
                    body: { occasion, skin_tone }
                });
                
                document.getElementById('rec-reason').textContent = `✨ ${res.reason}`;
                
                const grid = document.getElementById('rec-grid');
                grid.innerHTML = '';
                res.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'glass-panel clothing-card';
                    const imageUrl = item.image.startsWith('http') ? item.image : `http://127.0.0.1:8000${item.image}`;
                    card.innerHTML = `
                        <img src="${imageUrl}" alt="${item.category}">
                        <div class="clothing-info">
                            <h3 style="font-size: 1.1rem;">${item.category || 'Clothing'}</h3>
                            <div style="font-size: 0.85rem; color: #cbd5e1;">Color: ${item.color}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                resultContainer.style.display = 'block';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.color = "#94a3b8"; // Neutral gray instead of red
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Outfit';
            }
        });
    </script>
</body>
</html>
