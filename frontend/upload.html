<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Item - GarderobeAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-bg"></div>
    <div class="page-overlay"></div>
    <nav>
        <a href="welcome.html" class="logo-container">
            <img src="assets/logo_clean.png" alt="GarderobeAI" class="logo-img">
            <span class="logo">GarderobeAI</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">My Wardrobe</a>
            <a href="upload.html" style="color: #fff;">Upload</a>
            <a href="recommend.html">Get Outfit</a>
            <a href="mannequin.html">3D View</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container animate-in">
        <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
            <h1 style="text-align: center;">Add to Wardrobe</h1>
            <p style="text-align: center; color: #94a3b8; margin-bottom: 2rem;">Our AI will automatically detect the color and category of your clothing.</p>
            
            <form id="upload-form">
                <div class="form-group">
                    <label>Clothing Image</label>
                    <input type="file" id="image" class="form-control" accept="image/*" required style="padding: 1rem; cursor: pointer; background: rgba(59, 130, 246, 0.1); border: 1px dashed var(--primary-color);">
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label>Category (Optional)</label>
                    <select id="category" class="form-control">
                        <option value="">Let AI Detect</option>
                        <option value="Shirt">Shirt</option>
                        <option value="Tshirt">Tshirt</option>
                        <option value="Pants">Pants</option>
                        <option value="Trousers">Trousers</option>
                        <option value="Lower">Lower</option>
                        <option value="Skirt">Skirt</option>
                        <option value="Dress">Dress</option>
                        <option value="Jacket">Jacket</option>
                        <option value="Shoes">Shoes</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label>Occasion</label>
                    <select id="occasion" class="form-control">
                        <option value="Casual">Casual</option>
                        <option value="Formal">Formal</option>
                        <option value="Party">Party</option>
                        <option value="Work">Work</option>
                        <option value="Sport">Sport</option>
                    </select>
                </div>
                
                <div id="preview-container" style="display: none; margin-bottom: 1.5rem; text-align: center;">
                    <img id="preview-img" src="" alt="Preview" style="max-width: 100%; max-height: 300px; border-radius: 8px;">
                </div>

                <button type="submit" class="btn btn-primary" id="upload-btn" style="width: 100%;">Upload & Analyze</button>
                <div id="status-msg" style="text-align: center; margin-top: 1rem; display: none;"></div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const fileInput = document.getElementById('image');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const btn = document.getElementById('upload-btn');
            const status = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.textContent = 'Analyzing...';
            status.style.display = 'block';
            status.style.color = '#94a3b8';
            status.textContent = 'Uploading and processing with AI...';

            const formData = new FormData();
            formData.append('image', file);
            
            const categorySelect = document.getElementById('category').value;
            if (categorySelect) {
                formData.append('category', categorySelect);
            }

            const occasionSelect = document.getElementById('occasion').value;
            formData.append('occasion', occasionSelect);

            try {
                const res = await apiCall('/upload/', {
                    method: 'POST',
                    body: formData,
                    isFormData: true
                });
                
                status.style.color = '#10b981';
                status.innerHTML = `Success! Detected: <strong>${res.category}</strong> (${res.color})`;
                setTimeout(() => window.location.href = 'dashboard.html', 2000);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Upload & Analyze';
                status.style.color = 'var(--accent-color)';
                status.textContent = err.message;
            }
        });
    </script>
</body>
</html>
